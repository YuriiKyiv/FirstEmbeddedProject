[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Не притискати GPIO0 (BOOT) до землі через DTR/RTS, поки відкритий Serial Monitor
monitor_dtr = 0
monitor_rts = 0


; Збирати лише main.cpp; main_homw.cpp — старий варіант без вебсервера,
; він теж визначає setup()/loop() і ламає лінкування (multiple definition)
build_src_filter = +<*> -<main_homw.cpp>
